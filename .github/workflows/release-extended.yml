name: Release Extended

on:
  push:
    tags:
      - "v*.post*"

permissions:
  contents: write
  id-token: write  # Required for PyPI Trusted Publisher (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi  # Must match the environment name set in PyPI Trusted Publisher config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python and uv
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Build
        run: |
          pip install uv
          uv build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --generate-notes \
            --title "$TAG_NAME"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
